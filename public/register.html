<!doctype html>
<html lang="fi">
  <!--AUTHOR: ALEKSI NIEMINEN -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sivun otsikko</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="contheader"><h1>Rekisteröityminen</h1></div>
      <form>
        <div class="contlabel">
          <label for="username">Valitse käyttäjätunnus:</label>
        </div>
        <div class="continput">
          <input type="text" id="username" name="username" required />
        </div>
        <div class="contlabel">
          <label for="email">Anna sähköpostiosoite:</label>
        </div>
        <div class="continput">
          <input type="text" id="username" name="username" required />
        </div>
        <div class="contlabel">
          <label for="password">Valitse salasana:</label>
        </div>
        <div class="continput">
          <input type="password" id="password" name="password" required />
        </div>
        <div class="contlabel">
          <label for="confirmpassword">Vahvista salasana:</label>
        </div>
        <div class="continput">
          <input
            type="password"
            id="confirmpassword"
            name="confirmpassword"
            required
          />
        </div>
        <div class="contlabel">
          <label for="registercode">Kutsukoodi:</label>
        </div>
        <div class="continput">
          <input type="text" id="registercode" name="registercode" required />
        </div>
        <div class="contbutton">
          <button type="submit">Rekisteröidy</button>
        </div>
      </form>
    </div>
  </body>
</html>
